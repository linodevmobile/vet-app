name: vet_app
description: "App veterinaria: grabación de audio, transcripción con IA y estructuración de historias clínicas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^3.0.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  json_annotation: ^4.11.0
  just_audio: ^0.9.42
  logger: ^2.5.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  record: ^6.2.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/splash/

# Config consumida por `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#0052CC"
  color_dark: "#0052CC"
  image: assets/splash/splash.png
  # Android 12+ usa el launcher icon adaptive (evita clipping por máscara circular del OS).
  android_12:
    color: "#0052CC"
