name: vet_app
description: "App veterinaria: grabación de audio, transcripción con IA y estructuración de historias clínicas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado + DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Persistencia
  flutter_secure_storage: ^9.2.2

  # Modelado — solo annotations; los generators van en dev_dependencies
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Audio
  record: ^5.2.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

  # Utilitario
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  very_good_analysis: ^7.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
